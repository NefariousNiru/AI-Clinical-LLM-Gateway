syntax = "proto3";

package grader.v1;

option csharp_namespace = "Grader.V1";

// ---------- Rubric (structured) ----------

enum CriterionType {
  CRITERION_TYPE_UNSPECIFIED = 0;
  MUST = 1;
  SHOULD = 2;
  BONUS = 3;
  CONTRAINDICATION = 4;
}

message Criterion {
  string key = 1;
  CriterionType type = 2;
  string verbiage = 3;           // 1..80 chars - enforce app side
  optional double weight = 4;    // >0 when present
}

message Section {
  string id = 1;
  string title = 2;
  double max_points = 3;
  string evaluation_question = 4;
  repeated Criterion criteria = 5;
}

message RubricPayload {
  string rubric_id = 1;
  string guideline_hint = 2;
  repeated Section sections = 3;
}

// ---------- Request payloads ----------

message DrugRelatedProblem {
  bool is_priority = 1;
  string identification = 2;
  string explanation = 3;
  string plan_recommendation = 4;
  string monitoring = 5;
}

// ---------- Feedback (response) ----------

message FeedbackSection {
  string score = 1;        // keep as string to match your model
  string evaluation = 2;
  string feedback = 3;
}

message ProblemFeedback {
  bool is_priority = 1;
  FeedbackSection identification = 2;
  FeedbackSection explanation = 3;
  FeedbackSection plan_recommendation = 4;
  FeedbackSection monitoring = 5;
}

// ---------- RPC messages ----------

message GradeRequest {
  RubricPayload rubric = 1;               // structured rubric only
  repeated DrugRelatedProblem problems = 2;

  string system_prompt = 3;
  string user_prompt_template = 4;
  string model_name = 5;

  string trace_id = 6;                    // optional passthrough
  string job_id = 7;                      // optional passthrough
}

message GradeResponse {
  repeated ProblemFeedback feedback = 1;  // same length/order as request.problems
  string model_name = 2;                  // actual model used
}

// Errors travel via gRPC status, with gateway placing a string code in metadata:
// Transient:  "network_error","provider_timeout","rate_limited","schema_mismatch"
// Terminal:   "invalid_rubric","unsupported_model","auth_failed","invalid_payload"

service Grader {
  rpc Grade(GradeRequest) returns (GradeResponse);
}
