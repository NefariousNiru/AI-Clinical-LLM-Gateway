syntax = "proto3";
package grader.v1;
import "google/protobuf/struct.proto";
option csharp_namespace = "Grader.V1";

// ---------- Feedback (response) ----------

message FeedbackSection {
  string score = 1;
  string evaluation = 2;
  string feedback = 3;
}

message ProblemFeedback {
  string name = 1;
  bool is_priority = 2;
  FeedbackSection identification = 3;
  FeedbackSection explanation = 4;
  FeedbackSection plan_recommendation = 5;
  FeedbackSection monitoring = 6;
}

// ---------- RPC messages ----------

message GradeRequest {
  repeated google.protobuf.Struct rubrics = 1;   // open JSON
  repeated google.protobuf.Struct payload = 2;   // open JSON

  string system_prompt = 3;
  string user_prompt_template = 4;
  string model_provider = 5;
  string model_name = 6;

  // passthroughs
  string trace_id = 7;
  string job_id = 8;
}

message GradeResponse {
  repeated ProblemFeedback feedback = 1;  // same length/order as request.problems
  string model_provider = 2;              // model provider used
  string model_name = 3;                  // actual model used
}

// Errors travel via gRPC status, with gateway placing a string code in metadata:
// Transient:  "network_error","provider_timeout","rate_limited","schema_mismatch"
// Terminal:   "invalid_rubric","unsupported_model","auth_failed","invalid_payload"

service Grader {
  rpc Grade(GradeRequest) returns (GradeResponse);
}
